name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatage
        run: pnpm format:check

      - name: Typage
        run: pnpm typecheck

      - name: Contenu du dépôt
        run: pnpm validate:content

      - name: Tests unitaires
        run: pnpm test

      - name: Atelier des îlots
        run: pnpm --filter @bsls/site cosmos:export

      - name: Navigateur Playwright
        run: pnpm --filter @bsls/site exec playwright install --with-deps chromium

      # Vérifie d'abord qu'un contenu invalide casse le build, puis joue les
      # parcours contre un build réel des fixtures.
      - name: Tests de bout en bout
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/site/playwright-report
          retention-days: 7
