# projet désigné par le calligraphe à l'arbitrage du lot 1 : le 易筋經, puis deux vers qui
# disent l'entraînement, 寶劍鋒從磨礪出 et 梅花香自苦寒來
title: 易筋經
presentation: |
  L'entraînement. Le 易筋經, avec l'avertissement qui l'accompagne, 不按指示做，磨磚豈成鏡 : la
  consigne d'aujourd'hui, puis la sentence de 懷讓. Puis les deux vers du 警世賢文, chacun au
  service d'un mot : 苦煉, 寶劍鋒從磨礪出 ; 下功夫, 梅花香自苦寒來.
