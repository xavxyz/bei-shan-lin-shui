# projet désigné par le calligraphe à l'arbitrage du scan 2026-10-11_12_01.jpeg :
# hommage à 山山, que le calligraphe surnomme 閒仙 ; la pièce 閒仙機 en est la pièce-pôle
title: 閒仙機
presentation: |
  Hommage à 山山, que je surnomme 閒仙. Autour de 閒仙機, d'après lui (山山臨) : les dix tiges
  célestes de 天干流 et les douze branches de 地支 ; puis 水火調劑, pour horizontaliser les
  verticaux et verticaliser les horizontaux, deux des cinq points de sa méthode pour la cursive.
theme: ink
