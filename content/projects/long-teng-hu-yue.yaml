# projet désigné par le calligraphe à l'arbitrage du scan 2026-10-11_15_01.jpeg :
# 龍騰 (série 16, six feuilles) et 虎躍 (série 17, trois feuilles), autour de la pièce-pôle
title: 龍騰虎躍
presentation: |
  L'expression de ma vanité : le dragon et le tigre, explorés caractère par caractère, pour
  être présentés à 鄧岱崑, le 師父 de 山山. 龍騰, six feuilles au 春分, chacune sous une ligne
  du 乾 ; 虎躍, trois feuilles au 清明, sous le 履. Puis la pièce-pôle, 龍騰虎躍.
theme: ink
