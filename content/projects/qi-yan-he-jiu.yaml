title: 起研合究
rank: -1
gloss: Recherche sur le commencement, où trois enseignements se rejoignent.
presentation: |
  Hommage à 山山, pour les deux ans de mes cours avec lui, commencés le 5 novembre 2024.
  Plusieurs caractères et formes viennent de ses cours : 起 et 合 suivent le modèle de
  cursive folle de 懷素, le dernier 合 est de moi. Danser sur la pointe d'une aiguille est
  de lui, tiré de son manifeste du style libre : il est le taoïste de la dernière pièce.
