title: 天人地
presentation: |
  Hommage à l'enseignement de l'école de 太極功 Heaven Man Earth (heavenmanearth.com), dont je
  fais partie. 鬆 est au cœur de l'enseignement d'Adam Mizner. 天人地, le ciel, l'homme et la
  terre, écrit seul ; autour, 鬆胯, relâcher les hanches : exploré du régulier au style libre,
  puis pris dans des devises, 放心鬆胯, 堅持注意，忍受鬆胯, et 不受苦中苦，難為人上人.
theme: ink
