  # deux pages Notion réunies à l'arbitrage du lot 2 : 太虛幻境即是真如福地 et 假作真时真亦假
  # (https://claude.ai/share/5dc17005-056f-4406-bcb8-ff80e37b231a). Une pièce en trois feuilles :
  # l'arche du 太虛幻境 à l'aller (紅樓夢, chapitres 1 et 5), celle du 真如福地 au retour
  # (chapitre 116, où le roman dit 牌樓) ; chaque distique répond à l'autre vers pour vers.
  # La colonne vient après les deux arches, comme le mot de 甄士隱 après elles dans le roman (chapitre 120).
  # Le 紅樓夢 qui ouvrait la feuille de la colonne en est sorti : c'est le texte de la v2 de la pièce pôle, hong-lou-meng
  # Textes, contexte et traductions : docs/sources/hong-lou-meng.md.
  # Traductions de Li Tche-houa (李治華, Lǐ Zhìhuá) et Jacqueline Alézaïs (Le Rêve dans le
  # pavillon rouge, La Pléiade), sauf mention contraire :
  # 牌樓聯 : « les distiques des arches » (traduction de l'agent ; 牌樓, l'arche d'honneur à toit).
  # 太虛幻境即是真如福地 : « Le Domaine Illusoire de la Suprême Vanité est le Lieu fortuné de
  # constante vérité » (faite des deux noms de la Pléiade ; la phrase n'y a pas été retrouvée).
  # Mot de 甄士隱 à 賈雨村, aux trois quarts du chapitre 120.
  # 太虛幻境 : « Domaine Illusoire de la Suprême Vanité » ; arche vue en rêve par 甄士隱 au chapitre 1,
  # puis par 寶玉 au chapitre 5 :
  # 假作真時真亦假，無為有處有還無 : « Quand on tient le faux pour être vrai, le vrai à son tour est faux ;
  # Où du néant on fait l'Être, l'Être est encor du Néant. » (chapitre 5)
  # 真如福地 : « Lieu fortuné de constante vérité » ; arche que 寶玉 retrouve à la place de l'autre
  # au chapitre 116 :
  # 假去真來真勝假，無原有是有非無 : « Le faux passé, quand vient le vrai, le vrai prévaut sur le faux.
  # Le non-être ayant été l'être, l'être n'est plus le non-être. » (chapitre 116)
  - slug: pai-lou-lian
    title: 牌樓聯
